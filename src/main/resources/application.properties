# ===============================
# CloudNotes - application settings
# ===============================
spring.application.name=CloudNotes

# Render gives the port in the PORT environment variable. Locally we use 8080.
server.port=${PORT:8080}

# ---------- Firebase ----------
# Option A (Render): set FIREBASE_CREDENTIALS env var = full service account JSON (or Base64 of it)
firebase.credentials.json=${FIREBASE_CREDENTIALS:}
# Option B: path to the JSON file. Leave empty to use ./serviceAccountKey.json
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---------- Errors ----------
# Our GlobalExceptionHandler shows friendly pages, so hide stack traces
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# ---------- Actuator (health check for Render) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Misc ----------
server.compression.enabled=true
spring.mvc.hiddenmethod.filter.enabled=false
logging.level.root=INFO
logging.level.com.pablochomcobar.cloudnotes=INFO
