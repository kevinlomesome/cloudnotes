<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
    Reusable page pieces. Other pages include them with th:replace, e.g.
    <head th:replace="~{fragments/layout :: head('Home')}"></head>
-->

<!-- ===== <head>: meta tags, Bootstrap, icons, our CSS ===== -->

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CloudNotes - simple cloud notes app built with Spring Boot and Firebase">
    <title th:text="${pageTitle} + ' | CloudNotes'">CloudNotes</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <!-- ===== Top navigation bar ===== -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom sticky-top app-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <span class="brand-icon"><i class="bi bi-cloud-fill"></i></span>
                <span class="fw-bold">Cloud<span class="text-primary">Notes</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-grid me-1"></i>All Notes</a>
                    </li>
                    <li class="nav-item mt-2 mt-lg-0">
                        <a class="btn btn-primary btn-sm px-3" th:href="@{/notes/new}">
                            <i class="bi bi-plus-lg me-1"></i>New Note
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== Success / error messages (flash attributes or model attributes) ===== -->
    <div th:fragment="alerts">
        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show d-flex align-items-center auto-dismiss" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center"
            role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ===== Footer ===== -->
    <footer th:fragment="footer" class="app-footer mt-auto py-4">
        <div
            class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small text-secondary">
            <span><i class="bi bi-cloud me-1"></i>CloudNotes &copy; <span
                    th:text="${#dates.year(#dates.createNow())}">2026</span></span>
            <span>Built by <strong>Kevin Lomesome</strong> &middot; Spring Boot + Firebase</span>
        </div>
    </footer>

    <!-- ===== Scripts ===== -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/app.js}"></script>
    </th:block>

</body>

</html>
