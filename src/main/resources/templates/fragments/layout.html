<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--
    Reusable page pieces. Other pages include them with th:replace, e.g.
    <head th:replace="~{fragments/layout :: head('Home')}"></head>
-->

<!-- ===== <head>: meta tags, Bootstrap, icons, our CSS ===== -->

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CloudNotes - simple cloud notes app built with Spring Boot and Firebase">
    <title th:text="${pageTitle} + ' | CloudNotes'">CloudNotes</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

    <!-- ===== Top navigation bar ===== -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom sticky-top app-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <span class="brand-icon"><i class="bi bi-cloud-fill"></i></span>
                <span class="fw-bold">Cloud<span class="text-primary">Notes</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item" th:if="${isLoggedIn}">
                        <a class="nav-link" th:href="@{/}"><i class="bi bi-grid me-1"></i>My Notes</a>
                    </li>
                    <li class="nav-item" th:if="${isLoggedIn}">
                        <a class="btn btn-primary btn-sm px-3" th:href="@{/notes/new}">
                            <i class="bi bi-plus-lg me-1"></i>New Note
                        </a>
                    </li>

                    <!-- User Logged In Display & Logout -->
                    <li class="nav-item dropdown" th:if="${isLoggedIn}">
                        <button class="btn btn-light btn-sm dropdown-toggle d-flex align-items-center gap-1 border"
                                type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle text-primary"></i>
                            <span th:text="${userName != null ? userName : userEmail}">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><span class="dropdown-item-text text-muted small" th:text="${userEmail}">email</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <button class="dropdown-item text-danger" type="button" onclick="firebaseLogout()">
                                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                                </button>
                            </li>
                        </ul>
                    </li>

                    <!-- Google Sign-in button if NOT logged in -->
                    <li class="nav-item" th:unless="${isLoggedIn}">
                        <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-2 px-3 shadow-sm"
                                type="button" onclick="firebaseGoogleLogin()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48">
                                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                                <path fill="#FF3D00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
                                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                            </svg>
                            <span>Sign in with Google</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===== Success / error messages ===== -->
    <div th:fragment="alerts">
        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show d-flex align-items-center auto-dismiss" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Success</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center"
            role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ===== Footer ===== -->
    <footer th:fragment="footer" class="app-footer mt-auto py-4">
        <div
            class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small text-secondary">
            <span><i class="bi bi-cloud me-1"></i>CloudNotes &copy; <span
                    th:text="${#dates.year(#dates.createNow())}">2026</span></span>
            <span>Built by <strong>Kevin Lomesome</strong> &middot; Spring Boot + Firebase</span>
        </div>
    </footer>

    <!-- ===== Scripts & Firebase Auth ===== -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Firebase SDK (Modular via compat for simple browser usage) -->
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyBdeCdTJyHIE1djCr4jqm9b2tHFP9T_Joo",
                authDomain: "cloudnotes-8d832.firebaseapp.com",
                projectId: "cloudnotes-8d832",
                storageBucket: "cloudnotes-8d832.firebasestorage.app",
                messagingSenderId: "610573011349",
                appId: "1:610573011349:web:0dde8ccca28d9cb5d8ce9c"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }

            const auth = firebase.auth();
            const provider = new firebase.auth.GoogleAuthProvider();

            async function firebaseGoogleLogin() {
                try {
                    const result = await auth.signInWithPopup(provider);
                    const user = result.user;
                    const idToken = await user.getIdToken();

                    // Send ID token to our Spring Boot backend
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idToken: idToken })
                    });

                    if (response.ok) {
                        window.location.href = '/';
                    } else {
                        const errorData = await response.json();
                        alert('Login failed on server: ' + (errorData.error || 'Unknown error'));
                    }
                } catch (error) {
                    console.error('Google Sign-in Error:', error);
                    alert('Sign in failed: ' + error.message);
                }
            }

            async function firebaseLogout() {
                try {
                    await auth.signOut();
                    await fetch('/api/auth/logout', { method: 'POST' });
                    window.location.href = '/';
                } catch (error) {
                    console.error('Logout error:', error);
                    window.location.href = '/';
                }
            }
        </script>
        <script th:src="@{/js/app.js}"></script>
    </th:block>

</body>

</html>
